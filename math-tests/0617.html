            const container = document.getElementById('questions-list');
            container.innerHTML = '';

            // 篩選資料
            const filteredData = questionsData.filter(q => {
                // 類別過濾
                if (currentFilter !== 'all' && q.category !== currentFilter) return false;
                // 搜尋過濾
                if (searchQuery) {
                    const normalizedQuery = searchQuery.toLowerCase();
                    const inQuestion = q.question.toLowerCase().includes(normalizedQuery);
                    const inRationale = q.rationale.toLowerCase().includes(normalizedQuery);
                    const inCategory = q.categoryName.toLowerCase().includes(normalizedQuery);
                    if (!inQuestion && !inRationale && !inCategory) return false;
                }
                return true;
            });

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <svg class="w-12 h-12 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="text-slate-500 text-sm">沒有找到符合條件的題目，請換個搜尋詞試試看！</p>
                    </div>
                `;
                return;
            }

            filteredData.forEach((q, index) => {
                const state = userState[q.id];
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden transition-all duration-200 hover:shadow-md";
                card.id = `q-card-${q.id}`;

                // 判斷選項狀態 class
                const optionsHtml = q.options.map((opt, optIdx) => {
                    let btnClass = "border-slate-200 hover:bg-slate-50 text-slate-700 bg-white";
                    let iconHtml = '';

                    if (state.selectedIndex !== null) {
                        if (optIdx === q.correctIndex) {
                            // 正確解答
                            btnClass = "border-emerald-500 bg-emerald-50 text-emerald-800 font-medium";
                            iconHtml = `<svg class="w-4 h-4 text-emerald-600 shrink-0" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>`;
                        } else if (state.selectedIndex === optIdx) {
                            // 答錯解答
                            btnClass = "border-rose-500 bg-rose-50 text-rose-800";
                            iconHtml = `<svg class="w-4 h-4 text-rose-600 shrink-0" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>`;
                        } else {
                            btnClass = "border-slate-100 text-slate-400 bg-slate-50/50 cursor-not-allowed";
                        }
                    }

                    const prefix = String.fromCharCode(65 + optIdx); // A, B, C, D
                    return `
                        <button onclick="selectOption(${q.id}, ${optIdx})" ${state.selectedIndex !== null ? 'disabled' : ''} class="w-full border p-3.5 rounded-xl text-left text-sm flex items-center justify-between gap-3 transition-all ${btnClass}">
                            <div class="flex items-center gap-3">
                                <span class="w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center font-bold text-xs text-slate-500 shrink-0 select-none">${prefix}</span>
                                <span>${opt}</span>
                            </div>
                            ${iconHtml}
                        </button>
                    `;
                }).join('');

                // 展開控制
                const isExplanationVisible = allExpanded || state.showExplanation;
                const isHintVisible = state.showHint;

                card.innerHTML = `
                    <!-- 頂部卡片標籤 -->
                    <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex flex-wrap justify-between items-center gap-2">
                        <div class="flex items-center gap-2.5">
                            <span class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md text-xs font-bold border border-indigo-100">第 ${q.id} 題</span>
                            <span class="text-xs text-slate-400">•</span>
                            <span class="text-xs text-slate-500 font-medium">${q.categoryName}</span>
                            <span class="text-xs text-slate-400">•</span>
                            <span class="text-xs" title="難度評級">難度：<span class="text-amber-500">${q.difficulty}</span></span>
                        </div>
                        
                        <!-- 標記已掌握按鈕 -->
                        <button onclick="toggleMastered(${q.id})" class="flex items-center gap-1.5 px-3 py-1 rounded-lg border text-xs font-medium transition-all ${state.isMastered ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                            <span>${state.isMastered ? '已標記精熟' : '標記為精熟'}</span>
                        </button>
                    </div>

                    <!-- 題目內容 -->
                    <div class="p-6 space-y-6">
                        <div class="text-base font-medium leading-relaxed text-slate-900 select-all">
                            ${q.question}
                        </div>

                        <!-- 選項清單 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${optionsHtml}
                        </div>

                        <!-- 操作按鈕 -->
                        <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100 justify-between items-center">
                            <div class="flex gap-2">
                                <button onclick="toggleHint(${q.id})" class="px-3.5 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 transition-all flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 01-2 2h0a2 2 0 01-2-2v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                                    <span>${isHintVisible ? '隱藏提示' : '顯看提示'}</span>
                                </button>
                                <button onclick="toggleSingleExplanation(${q.id})" class="px-3.5 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 transition-all flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                    <span>${isExplanationVisible ? '隱藏解答' : '觀看解答'}</span>
                                </button>
                            </div>
                            
                            ${state.selectedIndex !== null ? `
                                <div class="text-xs font-semibold ${state.selectedIndex === q.correctIndex ? 'text-emerald-600' : 'text-rose-600'}">
                                    ${state.selectedIndex === q.correctIndex ? '✓ 回答正確' : '✗ 回答錯誤'}
                                </div>
                            ` : ''}
                        </div>

                        <!-- 提示區區塊 -->
                        <div id="hint-box-${q.id}" class="${isHintVisible ? 'block' : 'hidden'} bg-amber-50/50 border border-amber-100 rounded-xl p-4 text-xs text-amber-900 leading-relaxed">
                            <span class="font-bold text-amber-800 block mb-1">💡 解題提示：</span>
                            ${q.hint}
                        </div>

                        <!-- 解析與答案區塊 -->
                        <div id="exp-box-${q.id}" class="${isExplanationVisible ? 'block' : 'hidden'} bg-indigo-50/40 border border-indigo-100/60 rounded-xl p-5 text-sm text-slate-800 leading-relaxed">
                            <div class="flex items-center gap-2 mb-3 pb-2 border-b border-indigo-100/40">
                                <span class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded font-bold">正確答案：${String.fromCharCode(65 + q.correctIndex)}</span>
                                <span class="text-xs text-indigo-700 font-bold">(${q.options[q.correctIndex]})</span>
                            </div>
                            <div class="space-y-2 select-all">
                                <span class="font-bold text-slate-900 block text-xs">📝 詳細解析：</span>
                                <div>${q.rationale}</div>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            // 重新觸發 MathJax 排版新加入的數學式
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        // 選擇選項互動
        function selectOption(qId, optIdx) {
            if (userState[qId].selectedIndex !== null) return; // 已回答過
            userState[qId].selectedIndex = optIdx;
            userState[qId].showExplanation = true; // 答完自動展開該題解析
            
            // 如果回答正確，自動將精熟狀態也開啟
            const correctOptIdx = questionsData.find(q => q.id === qId).correctIndex;
            if (optIdx === correctOptIdx) {
                userState[qId].isMastered = true;
            }

            renderQuestions();
            updateStats();
        }

        // 切換單題提示
        function toggleHint(qId) {
            userState[qId].showHint = !userState[qId].showHint;
            renderQuestions();
        }

        // 切換單題解答
        function toggleSingleExplanation(qId) {
            // 如果正在「全局展開」狀態下，個別按鈕控制個別狀態
            if (allExpanded) {
                userState[qId].showExplanation = false; 
            } else {
                userState[qId].showExplanation = !userState[qId].showExplanation;
            }
            renderQuestions();
        }

        // 全局切換所有答案
        function toggleAllAnswers() {
            allExpanded = !allExpanded;
            
            // 同步所有個體狀態
            questionsData.forEach(q => {
                userState[q.id].showExplanation = allExpanded;
            });

            const btn = document.getElementById('toggle-all-btn');
            const text = document.getElementById('toggle-text');
            const icon = document.getElementById('toggle-icon');

            if (allExpanded) {
                text.textContent = '隱藏所有答案與解析';
                btn.className = "flex-1 md:flex-initial bg-slate-700 hover:bg-slate-800 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-all shadow-sm flex items-center justify-center gap-2";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.882 9.882L9.9 9.9M13.882 13.882l-.1-.1m-1.957-1.959L4.95 4.95M19.05 19.05l-4.95-4.95m0 0L19.05 4.95"></path>`;
            } else {
                text.textContent = '展開所有答案與解析';
                btn.className = "flex-1 md:flex-initial bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-all shadow-sm hover:shadow flex items-center justify-center gap-2";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
            }

            renderQuestions();
        }

        // 標記精熟度狀態
        function toggleMastered(qId) {
            userState[qId].isMastered = !userState[qId].isMastered;
            renderQuestions();
            updateStats();
        }

        // 分類過濾
        function filterCategory(cat) {
            currentFilter = cat;
            
            // 更新按鈕樣式
            document.querySelectorAll('.category-filter').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "category-filter active px-3 py-1.5 rounded-lg text-xs font-medium border transition-all bg-indigo-50 border-indigo-200 text-indigo-700";
                } else {
                    btn.className = "category-filter px-3 py-1.5 rounded-lg text-xs font-medium border transition-all bg-white border-slate-200 text-slate-600 hover:bg-slate-50";
                }
            });

            renderQuestions();
        }

        // 搜尋處理
        function handleSearch() {
            searchQuery = document.getElementById('search-input').value;
            renderQuestions();
        }

        // 更新數據看板
        function updateStats() {
            let correctCount = 0;
            let masteredCount = 0;

            questionsData.forEach(q => {
                const state = userState[q.id];
                if (state.selectedIndex === q.correctIndex) {
                    correctCount++;
                }
                if (state.isMastered) {
                    masteredCount++;
                }
            });

            // 計算精熟進度百分比 (精熟掌握度比單純答對更具指標性)
            const percent = Math.round((masteredCount / questionsData.length) * 100);

            // 更新 DOM
            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-mastered').textContent = masteredCount;
            document.getElementById('progress-percent').textContent = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }
    </script>
</body>
</html>
